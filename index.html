<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Expense Tracker PWA</title>
    <!-- PWA Manifest & Theme Color -->
    <meta name="theme-color" content="#4f46e5">
    <meta name="description" content="Secure Multi-User Expense Tracker PWA with Responsive Desktop & Mobile UI, Real-Time Cloud Sync & OCR">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2845/2845722.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js for Visual Dashboard -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Tesseract.js for Frontend OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <!-- PDF.js for parsing PDF Bank Statements -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        if (window.pdfjsLib) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }
    </script>

    <!-- Firebase SDK (Compat Version) for Auth, Firestore, & Real-time Cloud Sync -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="h-full text-slate-800 antialiased font-sans select-none overflow-x-hidden">

    <!-- LOGIN / AUTH SCREEN -->
    <div id="auth-screen" class="fixed inset-0 bg-indigo-900 text-white z-50 flex flex-col items-center justify-center p-6 hidden">
        <div class="w-full max-w-md space-y-6">
            <div class="text-center space-y-2">
                <div class="w-16 h-16 bg-white/10 rounded-3xl flex items-center justify-center mx-auto mb-3 backdrop-blur-md border border-white/20 shadow-xl">
                    <i data-lucide="wallet" class="w-8 h-8 text-indigo-200"></i>
                </div>
                <h1 class="text-2xl font-extrabold tracking-tight" id="auth-title">Welcome Back</h1>
                <p class="text-xs text-indigo-200" id="auth-subtitle">Sign in to sync your personal ledger across PC and mobile</p>
            </div>

            <div class="bg-white/10 backdrop-blur-md p-6 rounded-3xl border border-white/20 shadow-2xl space-y-4">
                <form id="auth-form" onsubmit="window.app.handleAuth(event)" class="space-y-3">
                    <div>
                        <label class="text-[11px] font-bold uppercase tracking-wider text-indigo-200 mb-1 block">Email Address</label>
                        <input type="email" id="auth-email" required placeholder="you@example.com" class="w-full px-3.5 py-2.5 text-xs bg-black/20 text-white placeholder-indigo-300 border border-white/20 rounded-xl focus:outline-none focus:ring-2 focus:ring-white">
                    </div>
                    <div>
                        <label class="text-[11px] font-bold uppercase tracking-wider text-indigo-200 mb-1 block">Password</label>
                        <input type="password" id="auth-password" required placeholder="••••••••" class="w-full px-3.5 py-2.5 text-xs bg-black/20 text-white placeholder-indigo-300 border border-white/20 rounded-xl focus:outline-none focus:ring-2 focus:ring-white">
